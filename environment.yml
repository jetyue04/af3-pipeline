name: af3-pipeline
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # Scientific stack — conda-forge gives native ARM64 builds for these
  - numpy
  - pandas>=2.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - scipy
  - biopython>=1.81
  - rdkit
  # Jupyter
  - jupyterlab>=4.0
  - ipywidgets>=8.0
  - tqdm>=4.65
  # OpenMM ecosystem (pdbfixer depends on it)
  - openmm
  - pdbfixer
  - pip:
    # pip-only packages
    - py3Dmol==2.5.5
    - nglview==3.1.4
    - meeko==0.8.0
    - vina==1.2.7
    - prodigy-prot==2.4.0
